name: 每日早报推送

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      city:
        description: '城市名称（可选）'
        required: false
        default: ''

jobs:
  daily-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 运行每日推送
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          CITY: ${{ github.event.inputs.city || secrets.CITY || '北京' }}
          NEWS_COUNT: ${{ secrets.NEWS_COUNT || '10' }}
        run: python push.py
      
      - name: 完成
        run: echo "每日推送任务完成"
